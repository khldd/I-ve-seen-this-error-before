[project]
name = "steb"
version = "0.0.1"
description = "steb (seen this error before) - a personal error memory for developers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khaled" }, { name = "Haider" }]
# Runtime dependencies are added phase by phase as features land (see CLAUDE.md roadmap).
dependencies = []

# Entry points are added when the corresponding code exists:
#   steb     = "steb.cli:app"           (Phase 1)
#   steb-mcp = "steb.mcp_server:main"   (Phase 6)

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steb"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "D",   # pydocstyle (documented code is graded)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
